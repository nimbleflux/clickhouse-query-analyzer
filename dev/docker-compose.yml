services:
  # ---------------------------------------------------------------------------
  # Default stack: a single ClickHouse node. This is what `make dev` starts.
  # It has no external dependencies (see the note on the `s3` profile below
  # for why MinIO moved out of the default stack).
  #
  # Opt-in profiles:
  #   repl — a 2nd ClickHouse node + Keeper, for the Replication / DDL
  #          dashboards and the ReplicatedMergeTree demo
  #          (`make dev-clickhouse-repl` / `make seed-replication`).
  #   s3   — MinIO + an S3 storage disk, for the remote-table advisor and
  #          S3-engine demos (`make dev-clickhouse-s3`). ClickHouse validates
  #          disks at startup, so the S3 disk config (s3-storage.xml) is only
  #          mounted for this variant. NOTE: MinIO's community images are no
  #          longer publicly pullable (Docker Hub repo deleted, quay.io repo
  #          auth-required) — this profile only works if you have a working
  #          MinIO image locally or access to a registry that serves it.
  # ---------------------------------------------------------------------------

  minio:
    profiles: ["s3"]
    image: quay.io/minio/minio:latest
    ports:
      - "19001:9000"
      - "19002:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ch-net

  minio-init:
    profiles: ["s3"]
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - ch-net
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin123 &&
      mc mb --ignore-existing myminio/clickhouse-data &&
      echo 'Bucket created successfully'
      "

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    hostname: clickhouse
    ports:
      - "18123:8123"
      - "19000:9000"
    environment:
      CLICKHOUSE_DB: system
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./config.xml:/etc/clickhouse-server/config.d/analyzer.xml
      - ./users.xml:/etc/clickhouse-server/users.d/analyzer.xml
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ch-net

  # ---------------------------------------------------------------------------
  # `s3` profile: ClickHouse with the S3 storage disk mounted, talking to the
  # MinIO above. Distinct host ports so it can run alongside the default node.
  # ---------------------------------------------------------------------------

  clickhouse-s3:
    image: clickhouse/clickhouse-server:latest
    hostname: clickhouse-s3
    profiles: ["s3"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "18223:8123"
      - "19100:9000"
    environment:
      CLICKHOUSE_DB: system
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse-s3-data:/var/lib/clickhouse
      - ./config.xml:/etc/clickhouse-server/config.d/analyzer.xml
      - ./s3-storage.xml:/etc/clickhouse-server/config.d/s3-storage.xml
      - ./users.xml:/etc/clickhouse-server/users.d/analyzer.xml
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ch-net

  # ---------------------------------------------------------------------------
  # `repl` profile: a 2nd ClickHouse node + Keeper, for the Replication / DDL
  # dashboards and the ReplicatedMergeTree demo (see `make seed-replication`).
  # ---------------------------------------------------------------------------

  clickhouse-keeper:
    image: clickhouse/clickhouse-keeper:latest
    profiles: ["repl"]
    ports:
      - "19181:9181"
    volumes:
      - keeper-data:/var/lib/clickhouse-keeper
      - ./keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml
    networks:
      - ch-net

  clickhouse-2:
    image: clickhouse/clickhouse-server:latest
    hostname: clickhouse-2
    profiles: ["repl"]
    depends_on:
      clickhouse-keeper:
        condition: service_started
    environment:
      CLICKHOUSE_DB: system
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse-2-data:/var/lib/clickhouse
      - ./config.xml:/etc/clickhouse-server/config.d/analyzer.xml
      - ./users.xml:/etc/clickhouse-server/users.d/analyzer.xml
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ch-net

networks:
  ch-net:

volumes:
  clickhouse-data:
  clickhouse-2-data:
  clickhouse-s3-data:
  minio-data:
  keeper-data:
